name: DevSecOps Automated Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  static-code-analysis:
    name: Run Semgrep Source Code Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        # FIXED: Pinned mutable v4 tag to explicit commit SHA
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4

      - name: Run Semgrep CLI
        # FIXED: workflow alerts and explicitly target application security flaws
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep \
            semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/typescript \
            --exclude=".github/" \
            --error
  secrets-scanning:
    name: Run TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        # Crucial: Fetch all commit history (depth: 0) so TruffleHog can scan old commits
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
  container-security-scan:
    name: Build Image & Run Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        # FIXED: Pinned mutable v4 tag to explicit commit SHA
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4

      - name: Build Local Docker Image
        run: |
          docker build -t test-app:latest -f juice-shop-master/Dockerfile .

      - name: Run Trivy Vulnerability Scanner
        # FIXED: Pinned mutable master branch pointer to explicit commit SHA
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: 'test-app:latest'
          format: 'table'
          exit-code: '1' # Keeps the pipeline from breaking completely so you can read the report
          severity: 'CRITICAL,HIGH'
